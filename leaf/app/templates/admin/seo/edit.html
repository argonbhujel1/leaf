{% extends "admin/base.html" %}
{% block title %}Edit SEO{% endblock %}
{% block page_title %}SEO: {{ setting.page_key }}{% endblock %}
{% block content %}
<div class="admin-card">
  <div class="admin-card-header">
    <h2>SEO Settings — {{ setting.page_key }}</h2>
    <a href="{{ url_for('admin.seo_list') }}" class="btn btn-sm btn-outline">Back</a>
  </div>
  <div class="admin-card-body">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group"><label>Page Title</label><input type="text" name="title" value="{{ setting.title or '' }}" maxlength="200"></div>
      <div class="form-group"><label>Meta Description</label><textarea name="description" rows="3" maxlength="300">{{ setting.description or '' }}</textarea></div>
      <div class="form-group"><label>Keywords</label><input type="text" name="keywords" value="{{ setting.keywords or '' }}" maxlength="300"></div>
      <div class="form-group"><label>OG Title</label><input type="text" name="og_title" value="{{ setting.og_title or '' }}" maxlength="200"></div>
      <div class="form-group"><label>OG Description</label><textarea name="og_description" rows="2" maxlength="300">{{ setting.og_description or '' }}</textarea></div>
      <div class="form-group"><label>Robots</label><input type="text" name="robots" value="{{ setting.robots or 'index, follow' }}"></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('admin.seo_list') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

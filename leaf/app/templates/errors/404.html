{% extends "public/base.html" %}
{% block title %}Page Not Found | {{ site_name }}{% endblock %}
{% block content %}
<section class="section" style="min-height:50vh;display:flex;align-items:center;">
  <div class="container text-center">
    <h1 style="font-size:4rem;color:var(--primary);font-weight:800;">404</h1>
    <h2 class="section-title">Page Not Found</h2>
    <p class="section-subtitle">The page you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('public.home') }}" class="btn btn-primary">Go Home</a>
  </div>
</section>
{% endblock %}
